name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release version and main ancestry
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and VERSION disagree.' }
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Release commit must already be on main.' }
          }
          "ASTRA_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Godot 4.7.2 and Windows export template
        shell: pwsh
        run: |
          $base = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable'
          Invoke-WebRequest "$base/Godot_v4.7.2-stable_win64.exe.zip" -OutFile "$env:RUNNER_TEMP/godot.zip"
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot"
          Invoke-WebRequest "$base/Godot_v4.7.2-stable_export_templates.tpz" -OutFile "$env:RUNNER_TEMP/templates.zip"
          $target = "$env:APPDATA/Godot/export_templates/4.7.2.stable"
          New-Item -ItemType Directory $target -Force | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead("$env:RUNNER_TEMP/templates.zip")
          try {
            foreach ($name in @('windows_release_x86_64.exe', 'version.txt')) {
              $entry = $archive.GetEntry("templates/$name")
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, "$target/$name", $true)
            }
          } finally { $archive.Dispose() }
          "GODOT=$env:RUNNER_TEMP/godot/Godot_v4.7.2-stable_win64_console.exe" >> $env:GITHUB_ENV

      - name: Validate, export, boot the Windows executable and package
        shell: pwsh
        run: ./tools/build_windows.ps1 -Godot $env:GODOT

      - uses: actions/upload-artifact@v4
        with:
          name: ASTRA-${{ env.ASTRA_VERSION }}-windows
          path: |
            build/ASTRA-*-windows.zip
            build/ASTRA-*-windows.zip.sha256
          if-no-files-found: error

      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: build/logs/*
          if-no-files-found: ignore

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ASTRA ${{ env.ASTRA_VERSION }} — HEARTBEAT
          body_path: docs/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            build/ASTRA-*-windows.zip
            build/ASTRA-*-windows.zip.sha256
