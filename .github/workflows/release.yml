name: Publish ASTRA release

on:
  workflow_run:
    workflows: ["Godot CI"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-astra-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Validate release metadata and avoid duplicate publication
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION is not semver: $version"
            exit 1
          fi

          heading="$(grep -m1 -E "^# ASTRA ${version}([[:space:]]|$)" docs/RELEASE_NOTES.md || true)"
          if [ -z "$heading" ]; then
            echo "::error::docs/RELEASE_NOTES.md has no heading for ASTRA $version"
            exit 1
          fi
          title="${heading#\# }"
          if [ "$title" = "$heading" ]; then
            echo "::error::release heading is not a markdown H1"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v$version already exists; leaving the existing release untouched."
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Publishing $title from exact tested SHA $TESTED_SHA"

      - name: Download Windows RC from this exact Godot CI run
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build/release
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "ASTRA-$VERSION-windows-rc" --dir build/release

          zip_path="$(find build/release -type f -name "ASTRA-$VERSION-windows.zip" -print -quit)"
          sha_path="$(find build/release -type f -name "ASTRA-$VERSION-windows.zip.sha256" -print -quit)"
          test -n "$zip_path"
          test -n "$sha_path"

          actual="$(sha256sum "$zip_path" | awk '{print tolower($1)}')"
          expected="$(awk '{print tolower($1)}' "$sha_path")"
          test "$actual" = "$expected"

          echo "ZIP_PATH=$zip_path" >> "$GITHUB_ENV"
          echo "SHA_PATH=$sha_path" >> "$GITHUB_ENV"
          echo "ASSET_SHA256=$actual" >> "$GITHUB_ENV"

      - name: Extract this VERSION's release notes
        if: steps.gate.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail
          awk '
            BEGIN { on = 0 }
            /^# ASTRA / {
              if (on) exit
              prefix = "# ASTRA " ENVIRON["VERSION"] " "
              if (index($0, prefix) == 1) on = 1
            }
            on { print }
          ' docs/RELEASE_NOTES.md > build/release/release-notes.md
          test -s build/release/release-notes.md
          first="$(head -n 1 build/release/release-notes.md)"
          test "$first" = "# ${{ steps.gate.outputs.title }}"

      - name: Publish GitHub Release
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.gate.outputs.version }}
          TITLE: ${{ steps.gate.outputs.title }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            "$ZIP_PATH" "$SHA_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TESTED_SHA" \
            --title "$TITLE" \
            --notes-file build/release/release-notes.md
          echo "Released v$VERSION from $TESTED_SHA"
          echo "Asset SHA256: $ASSET_SHA256"
