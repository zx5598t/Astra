name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "VERSION"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: astra-release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release version and main ancestry
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and VERSION disagree.' }
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Release commit must already be on main.' }
          }
          $releaseTitle = ((Get-Content project.godot -TotalCount 1).Trim() -replace '^;\s*', '')
          if (-not $releaseTitle.StartsWith("ASTRA $version")) {
            $releaseTitle = "ASTRA $version"
          }
          "ASTRA_VERSION=$version" >> $env:GITHUB_ENV
          "ASTRA_RELEASE_TITLE=$releaseTitle" >> $env:GITHUB_ENV

      - name: Install Godot 4.7.2 and Windows export template
        shell: pwsh
        run: |
          $base = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable'
          Invoke-WebRequest "$base/Godot_v4.7.2-stable_win64.exe.zip" -OutFile "$env:RUNNER_TEMP/godot.zip"
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot"
          Invoke-WebRequest "$base/Godot_v4.7.2-stable_export_templates.tpz" -OutFile "$env:RUNNER_TEMP/templates.zip"
          $target = "$env:APPDATA/Godot/export_templates/4.7.2.stable"
          New-Item -ItemType Directory $target -Force | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead("$env:RUNNER_TEMP/templates.zip")
          try {
            foreach ($name in @('windows_release_x86_64.exe', 'version.txt')) {
              $entry = $archive.GetEntry("templates/$name")
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, "$target/$name", $true)
            }
          } finally { $archive.Dispose() }
          "GODOT=$env:RUNNER_TEMP/godot/Godot_v4.7.2-stable_win64_console.exe" >> $env:GITHUB_ENV

      - name: Validate, export, boot the Windows executable and package
        shell: pwsh
        run: ./tools/build_windows.ps1 -Godot $env:GODOT

      - uses: actions/upload-artifact@v4
        with:
          name: ASTRA-${{ env.ASTRA_VERSION }}-windows
          path: |
            build/ASTRA-*-windows.zip
            build/ASTRA-*-windows.zip.sha256
          if-no-files-found: error

      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: build/logs/*
          if-no-files-found: ignore

      - name: Publish version safely from this run
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:ASTRA_VERSION
          $tag = "v$version"
          $zip = "build/ASTRA-$version-windows.zip"
          $shaFile = "$zip.sha256"
          $repo = $env:GITHUB_REPOSITORY

          if (-not (Test-Path -LiteralPath $zip)) { throw "Missing release ZIP: $zip" }
          if (-not (Test-Path -LiteralPath $shaFile)) { throw "Missing release SHA file: $shaFile" }

          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $declaredHash = ((Get-Content -LiteralPath $shaFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($zipHash -ne $declaredHash) {
            throw "Package hash mismatch: ZIP=$zipHash SHA_FILE=$declaredHash"
          }

          git fetch --tags --force
          git show-ref --verify --quiet "refs/tags/$tag"
          $tagExists = $LASTEXITCODE -eq 0
          $tagCommit = $null
          if ($tagExists) {
            $tagCommit = (git rev-list -n 1 $tag).Trim()
          }

          $releaseJson = gh api "repos/$repo/releases/tags/$tag" 2>$null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            if (-not $tagExists) {
              throw "Release $tag exists but the Git tag is missing."
            }
            if ($env:GITHUB_REF_TYPE -eq 'tag' -and $tagCommit -ne $env:GITHUB_SHA) {
              throw "Tag run commit mismatch: $tag -> $tagCommit, run -> $env:GITHUB_SHA"
            }

            $release = $releaseJson | ConvertFrom-Json
            if ($release.name -ne $env:ASTRA_RELEASE_TITLE) {
              throw "Existing release title mismatch: '$($release.name)' != '$env:ASTRA_RELEASE_TITLE'"
            }
            if ($release.draft -or $release.prerelease) {
              throw "Existing release $tag is draft or prerelease."
            }

            $assetNames = @($release.assets | ForEach-Object { $_.name })
            foreach ($required in @("ASTRA-$version-windows.zip", "ASTRA-$version-windows.zip.sha256")) {
              if ($assetNames -notcontains $required) {
                throw "Existing release $tag is missing required asset '$required'. Refusing silent mutation."
              }
            }

            Write-Host "$tag is already published with required assets; leaving tag and release unchanged."
            exit 0
          }

          if ($tagExists) {
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "Release is missing but $tag resolves to $tagCommit instead of current build $env:GITHUB_SHA. Refusing to retag."
            }
            Write-Host "Using existing $tag at $tagCommit."
          } else {
            if ($env:GITHUB_REF_TYPE -eq 'tag') {
              throw "Tag-triggered run cannot find its own tag $tag."
            }
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tag $env:GITHUB_SHA -m "$env:ASTRA_RELEASE_TITLE"
            git push origin $tag
            Write-Host "Created $tag at $env:GITHUB_SHA."
          }

          gh release create $tag $zip $shaFile --repo $repo --verify-tag --title "$env:ASTRA_RELEASE_TITLE" --notes-file docs/RELEASE_NOTES.md --latest

          $published = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          if ($published.name -ne $env:ASTRA_RELEASE_TITLE) { throw "Published release title mismatch." }
          if ($published.draft -or $published.prerelease) { throw "Published release is not final." }
          $publishedNames = @($published.assets | ForEach-Object { $_.name })
          foreach ($required in @("ASTRA-$version-windows.zip", "ASTRA-$version-windows.zip.sha256")) {
            if ($publishedNames -notcontains $required) { throw "Published release missing '$required'." }
          }
          Write-Host "ASTRA $version release published from the current successful Windows build."
