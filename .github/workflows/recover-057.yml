name: Sync ASTRA 0.5.7 release notes

on:
  push:
    branches:
      - "release/0.5.7-release-fix"
    paths:
      - ".github/workflows/recover-057.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync release notes without changing provenance or assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG_COMMIT: e4b20a77e7295ff4afa4c4ed086f738272d9409e
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v0.5.7'
          git fetch --tags --force
          $tagCommit = (git rev-list -n 1 $tag).Trim()
          if ($tagCommit -ne $env:EXPECTED_TAG_COMMIT) {
            throw "$tag moved: $tagCommit"
          }

          $before = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          $beforeAssets = @($before.assets | Sort-Object id | ForEach-Object { "$($_.id):$($_.name):$($_.size):$($_.digest)" })

          gh release edit $tag --repo $env:GITHUB_REPOSITORY --title 'ASTRA 0.5.7 — CLEAR SIGNAL' --notes-file docs/RELEASE_NOTES.md --latest

          $after = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          $afterAssets = @($after.assets | Sort-Object id | ForEach-Object { "$($_.id):$($_.name):$($_.size):$($_.digest)" })
          if (($beforeAssets -join '|') -ne ($afterAssets -join '|')) {
            throw 'Release assets changed while syncing notes.'
          }
          if ($after.name -ne 'ASTRA 0.5.7 — CLEAR SIGNAL') { throw 'Release title mismatch after sync.' }
          if ($after.draft -or $after.prerelease) { throw 'Release state changed unexpectedly.' }
          Write-Host "RELEASE NOTES SYNC OK; assets unchanged."
