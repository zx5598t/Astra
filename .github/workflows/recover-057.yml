name: Verify ASTRA 0.5.7 release asset

on:
  push:
    branches:
      - "release/0.5.7-release-fix"
    paths:
      - ".github/workflows/recover-057.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify published assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ZIP_SHA256: 5ea10cb171ce3d42e66da54c3c14d2adff6f9648a3d86e8166146c016a0846ec
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path release-check -Force | Out-Null
          gh release download v0.5.7 --repo $env:GITHUB_REPOSITORY -D release-check -p 'ASTRA-0.5.7-windows.zip' -p 'ASTRA-0.5.7-windows.zip.sha256'

          $zip = 'release-check/ASTRA-0.5.7-windows.zip'
          $shaFile = 'release-check/ASTRA-0.5.7-windows.zip.sha256'
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $declared = ((Get-Content -LiteralPath $shaFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_ZIP_SHA256) { throw "Published ZIP SHA mismatch: $actual" }
          if ($declared -ne $actual) { throw "Published SHA file mismatch: $declared != $actual" }

          Expand-Archive -LiteralPath $zip -DestinationPath unpacked -Force
          if (-not (Test-Path -LiteralPath 'unpacked/ASTRA/ASTRA.exe')) { throw 'Published package is missing ASTRA/ASTRA.exe' }
          if (-not (Test-Path -LiteralPath 'unpacked/ASTRA/START_HERE.md')) { throw 'Published package is missing ASTRA/START_HERE.md' }
          if (-not (Test-Path -LiteralPath 'unpacked/ASTRA/LICENSES.md')) { throw 'Published package is missing ASTRA/LICENSES.md' }
          Write-Host "PUBLISHED RELEASE ASSET VERIFIED: $actual"
