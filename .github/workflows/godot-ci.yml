name: Godot CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  quick-stabilization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2 stable
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o godot.zip "$url"
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mv Godot_v4.7.2-stable_linux.x86_64 godot

      - name: Import project
        run: ./godot --headless --path . --import

      - name: Early passive carry gate
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://tests/early_balance_101_tests.gd 2>&1 | tee quick-balance.log
          grep -q "ASTRA EARLY BALANCE 101 OK" quick-balance.log

      - name: Deduction gate
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://tests/deduction_100_tests.gd 2>&1 | tee quick-deduction.log
          grep -q "ASTRA DEDUCTION 100 TESTS OK" quick-deduction.log

      - name: Active vs passive causal gate
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://tests/causal_101_tests.gd 2>&1 | tee quick-causal.log
          grep -q "ASTRA CAUSAL 101 TESTS OK" quick-causal.log

      - name: Alternative-route and role-tell fairness gate
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://tests/fairness_101_tests.gd 2>&1 | tee quick-fairness.log
          grep -q "ASTRA FAIRNESS 101 TESTS OK" quick-fairness.log

      - name: Preserve quick-gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-stabilization-logs
          path: quick-*.log
          if-no-files-found: ignore

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2 stable
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o godot.zip "$url"
          unzip -tq godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          ./godot --version

      - name: Import project and reject script errors
        run: |
          set -o pipefail
          ./godot --headless --path . --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" import.log; then
            echo "Godot import reported script errors."
            exit 1
          fi

      - name: Parse-check every script
        run: |
          failed=0
          while IFS= read -r f; do
            out=$(./godot --headless --path . --check-only --script "res://$f" 2>&1 || true)
            if echo "$out" | grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script"; then
              echo "::error file=$f::GDScript error"
              failed=1
            fi
          done < <(find scripts tests -name '*.gd' | sort)
          exit "$failed"

      - name: ASTRA suite (rules, fairness, 1.0 motion/deduction/minigame/UI layout gates, retained story tests)
        run: |
          failed=0
          while IFS='|' read -r script marker args; do
            case "$script" in ''|\#*) continue ;; esac
            log="test-${script%.gd}.log"
            ./godot --headless --path . --script "res://tests/$script" -- $args > "$log" 2>&1 || true
            if ! grep -q "$marker" "$log"; then echo "::error::$script did not print $marker"; failed=1; fi
            if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" "$log"; then echo "::error::$script reported script errors"; failed=1; fi
          done < tests/ci_suite.txt
          exit "$failed"

      - name: Preserve test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-logs
          path: test-*.log
          if-no-files-found: ignore

      - name: Boot main scene headlessly
        run: |
          set +e
          timeout 20s ./godot --headless --path . --quit-after 120 2>&1 | tee boot.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" boot.log; then
            echo "Main scene boot reported script errors."
            exit 1
          fi

  windows-validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2 stable for Windows
        shell: pwsh
        run: |
          $base = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable'
          $zip = "$env:RUNNER_TEMP/godot.zip"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Invoke-WebRequest "$base/Godot_v4.7.2-stable_win64.exe.zip" -OutFile $zip
              break
            } catch {
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds 3
            }
          }
          Expand-Archive $zip "$env:RUNNER_TEMP/godot"
          "GODOT=$env:RUNNER_TEMP/godot/Godot_v4.7.2-stable_win64_console.exe" >> $env:GITHUB_ENV
          & "$env:RUNNER_TEMP/godot/Godot_v4.7.2-stable_win64_console.exe" --version

      - name: Import project on Windows
        shell: pwsh
        run: |
          & $env:GODOT --headless --path . --import 2>&1 | Tee-Object -FilePath windows-import.log
          if (Select-String -Path windows-import.log -Pattern 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script') { throw 'Windows Godot import reported script errors.' }

      - name: Run the ASTRA suite on Windows
        shell: pwsh
        run: |
          foreach ($row in Get-Content tests/ci_suite.txt) {
            if ($row -match '^\s*(#|$)') { continue }
            $parts = $row.Split('|')
            $script = $parts[0]; $marker = $parts[1]; $extra = @()
            if ($parts.Length -gt 2 -and $parts[2] -ne '') { $extra = @('--') + $parts[2].Split(' ') }
            $log = "windows-$($script.Replace('.gd',''))" + '.log'
            & $env:GODOT --headless --path . --script "res://tests/$script" @extra 2>&1 | Tee-Object -FilePath $log | Out-Null
            if (-not (Select-String -Path $log -Pattern ([regex]::Escape($marker)))) { throw "$script did not pass on Windows." }
            if (Select-String -Path $log -Pattern 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script') { throw "$script reported script errors on Windows." }
          }
          # Match Linux CI semantics: pass/fail is determined by the required
          # success marker plus script-error scan, not Godot's final native
          # process code (which can remain non-zero on Windows after a clean test).
          exit 0

      - name: Boot main scene on Windows
        shell: pwsh
        run: |
          & $env:GODOT --headless --path . --quit-after 120 2>&1 | Tee-Object -FilePath windows-boot.log
          if (Select-String -Path windows-boot.log -Pattern 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script') { throw 'Windows main-scene boot reported script errors.' }

      - name: Preserve Windows diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation-logs
          path: windows-*.log
          if-no-files-found: ignore

  release-candidate-windows:
    if: startsWith(github.ref, 'refs/heads/release/') || github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Read release candidate version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "ASTRA_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Godot 4.7.2 and Windows export template
        shell: pwsh
        run: |
          $base = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable'
          Invoke-WebRequest "$base/Godot_v4.7.2-stable_win64.exe.zip" -OutFile "$env:RUNNER_TEMP/godot.zip"
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot"
          Invoke-WebRequest "$base/Godot_v4.7.2-stable_export_templates.tpz" -OutFile "$env:RUNNER_TEMP/templates.zip"
          $target = "$env:APPDATA/Godot/export_templates/4.7.2.stable"
          New-Item -ItemType Directory $target -Force | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead("$env:RUNNER_TEMP/templates.zip")
          try {
            foreach ($name in @('windows_release_x86_64.exe', 'version.txt')) {
              $entry = $archive.GetEntry("templates/$name")
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, "$target/$name", $true)
            }
          } finally { $archive.Dispose() }
          "GODOT=$env:RUNNER_TEMP/godot/Godot_v4.7.2-stable_win64_console.exe" >> $env:GITHUB_ENV

      - name: Run full Windows release-candidate build
        shell: pwsh
        run: ./tools/build_windows.ps1 -Godot $env:GODOT

      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-${{ env.ASTRA_VERSION }}-windows-rc
          path: |
            build/ASTRA-*-windows.zip
            build/ASTRA-*-windows.zip.sha256
          if-no-files-found: error

      - name: Preserve release-candidate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-candidate-logs
          path: build/logs/*
          if-no-files-found: ignore

  visual-review-windows:
    if: startsWith(github.ref, 'refs/heads/release/') || github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2 stable for visual QA
        shell: pwsh
        run: |
          $base = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable'
          $zip = "$env:RUNNER_TEMP/godot-visual.zip"
          Invoke-WebRequest "$base/Godot_v4.7.2-stable_win64.exe.zip" -OutFile $zip
          Expand-Archive $zip "$env:RUNNER_TEMP/godot-visual"
          "GODOT_VISUAL=$env:RUNNER_TEMP/godot-visual/Godot_v4.7.2-stable_win64_console.exe" >> $env:GITHUB_ENV

      - name: Import project for visual QA
        shell: pwsh
        run: |
          & $env:GODOT_VISUAL --headless --path . --import 2>&1 | Tee-Object -FilePath visual-import.log
          if (Select-String -Path visual-import.log -Pattern 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script') { throw 'Visual QA import reported script errors.' }

      - name: Capture visual QA screens
        shell: pwsh
        run: |
          & $env:GODOT_VISUAL --path . --script res://tests/visual_100.gd 2>&1 | Tee-Object -FilePath visual-100.log
          if (-not (Select-String -Path visual-100.log -Pattern 'ASTRA VISUAL 100 OK')) { throw 'visual_100.gd did not complete.' }
          if (Select-String -Path visual-100.log -Pattern 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script') { throw 'Visual QA reported script errors.' }

      - name: Upload visual QA captures
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-100
          path: build/qa/100/*.png
          if-no-files-found: error

      - name: Preserve visual QA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-logs
          path: visual-*.log
          if-no-files-found: ignore

