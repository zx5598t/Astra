name: Godot CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 stable
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mv Godot_v4.7.2-stable_linux.x86_64 godot
      - name: Import project
        run: ./godot --headless --path . --editor --quit 2>&1 | tee import.log
      - name: Diagnose GDScript chain
        run: |
          set +e
          for f in \
            scripts/npc_state.gd \
            scripts/truth_engine.gd \
            scripts/game_state.gd \
            scripts/social_game_state.gd \
            scripts/loop_game_state.gd \
            scripts/random_case_game_state.gd \
            scripts/progression_game_state.gd \
            scripts/hypothesis_game_state.gd \
            scripts/interactive_notebook_board.gd \
            scripts/main.gd \
            scripts/main_v004.gd \
            scripts/main_v005.gd \
            scripts/main_v006.gd \
            scripts/main_v007.gd \
            scripts/main_v008.gd \
            scripts/main_v009.gd; do
            echo "===== CHECK $f ====="
            ./godot --headless --path . --check-only --script "res://$f" || true
          done
          exit 1
      - name: Run deduction smoke test
        run: ./godot --headless --path . --script res://scripts/ci_smoke.gd
      - name: Boot main scene headlessly
        run: timeout 12s ./godot --headless --path . --quit-after 2 || test $? -eq 124
